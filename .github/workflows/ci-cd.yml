    #     host: ${{ secrets.SSH_HOST }}
    #     username: ${{ secrets.SSH_USER }}
    #     key: ${{ secrets.SSH_KEY }}
    #     script: |
    #       docker pull skinwalkerirl/ml-api:${{ github.sha }}
    #       docker-compose up -d